<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #score-board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 500px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }

    #score-board .label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    #score-display {
      font-size: 26px;
      font-weight: bold;
      color: #00d474;
      letter-spacing: 2px;
    }

    #canvas-wrapper {
      position: relative;
      border: 2px solid rgba(0, 212, 116, 0.3);
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(0, 212, 116, 0.1), 0 0 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 26, 46, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #overlay-title {
      font-size: 36px;
      font-weight: bold;
      color: #ff6b35;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #overlay-score {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 2px;
    }

    #overlay-score span {
      color: #00d474;
      font-size: 22px;
    }

    #restart-btn {
      margin-top: 8px;
      padding: 12px 36px;
      background: #00d474;
      color: #1a1a2e;
      border: none;
      border-radius: 6px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    #restart-btn:hover {
      background: #00f585;
      transform: scale(1.04);
    }

    #restart-btn:active {
      transform: scale(0.98);
    }

    #hint {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.3);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-board">
      <span class="label">Score</span>
      <span id="score-display">0</span>
      <span class="label">Snake</span>
    </div>
    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
      <div id="overlay">
        <div id="overlay-title">Game Over</div>
        <div id="overlay-score">Final Score: <span id="final-score">0</span></div>
        <button id="restart-btn">Restart</button>
      </div>
    </div>
    <div id="hint">Use arrow keys to control the snake</div>
  </div>

  <script>
    (() => {
      const COLS = 20;
      const ROWS = 20;
      const CELL = 25;
      const WIDTH = COLS * CELL;
      const HEIGHT = ROWS * CELL;
      const STEP_MS = 125;

      // Colors
      const C_BG        = '#16162a';
      const C_GRID      = '#1f1f38';
      const C_SNAKE_HEAD = '#00ff88';
      const C_SNAKE_BODY = '#00d474';
      const C_SNAKE_DARK = '#009950';
      const C_FOOD      = '#ff6b35';
      const C_FOOD_GLOW  = '#ff9060';

      const canvas = document.getElementById('game-canvas');
      const ctx    = canvas.getContext('2d');
      canvas.width  = WIDTH;
      canvas.height = HEIGHT;

      const overlay      = document.getElementById('overlay');
      const scoreDisplay = document.getElementById('score-display');
      const finalScore   = document.getElementById('final-score');
      const restartBtn   = document.getElementById('restart-btn');

      // ── State ────────────────────────────────────────────────────────────
      let snake, dir, nextDir, food, score, gameOver, lastStep, animId;

      function initState() {
        const midCol = Math.floor(COLS / 2);
        const midRow = Math.floor(ROWS / 2);
        snake = [
          { x: midCol,     y: midRow },
          { x: midCol - 1, y: midRow },
          { x: midCol - 2, y: midRow },
        ];
        dir     = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score   = 0;
        gameOver = false;
        lastStep = null;
        scoreDisplay.textContent = '0';
        overlay.classList.remove('visible');
        spawnFood();
      }

      function spawnFood() {
        const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
        let pos;
        do {
          pos = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS),
          };
        } while (occupied.has(`${pos.x},${pos.y}`));
        food = pos;
      }

      // ── Input ────────────────────────────────────────────────────────────
      const KEY_DIR = {
        ArrowUp:    { x: 0,  y: -1 },
        ArrowDown:  { x: 0,  y:  1 },
        ArrowLeft:  { x: -1, y:  0 },
        ArrowRight: { x: 1,  y:  0 },
      };

      document.addEventListener('keydown', e => {
        const d = KEY_DIR[e.key];
        if (!d) return;
        e.preventDefault();
        // Prevent 180-degree reversal
        if (d.x === -dir.x && d.y === -dir.y) return;
        nextDir = d;
      });

      restartBtn.addEventListener('click', () => {
        if (animId) cancelAnimationFrame(animId);
        initState();
        animId = requestAnimationFrame(loop);
      });

      // ── Game Logic ───────────────────────────────────────────────────────
      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Wall collision
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
          triggerGameOver();
          return;
        }
        // Self collision
        if (snake.some(s => s.x === head.x && s.y === head.y)) {
          triggerGameOver();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score++;
          scoreDisplay.textContent = score;
          spawnFood();
        } else {
          snake.pop();
        }
      }

      function triggerGameOver() {
        gameOver = true;
        finalScore.textContent = score;
        overlay.classList.add('visible');
      }

      // ── Rendering ────────────────────────────────────────────────────────
      function drawGrid() {
        ctx.strokeStyle = C_GRID;
        ctx.lineWidth = 0.5;
        for (let c = 0; c <= COLS; c++) {
          ctx.beginPath();
          ctx.moveTo(c * CELL, 0);
          ctx.lineTo(c * CELL, HEIGHT);
          ctx.stroke();
        }
        for (let r = 0; r <= ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * CELL);
          ctx.lineTo(WIDTH, r * CELL);
          ctx.stroke();
        }
      }

      function drawFood() {
        const x = food.x * CELL + CELL / 2;
        const y = food.y * CELL + CELL / 2;
        const r = CELL / 2 - 3;

        // Glow
        const grd = ctx.createRadialGradient(x, y, 1, x, y, r + 4);
        grd.addColorStop(0, 'rgba(255,107,53,0.6)');
        grd.addColorStop(1, 'rgba(255,107,53,0)');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, r + 4, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = C_FOOD;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();

        // Shine
        ctx.fillStyle = C_FOOD_GLOW;
        ctx.beginPath();
        ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawSnake() {
        snake.forEach((seg, i) => {
          const px = seg.x * CELL;
          const py = seg.y * CELL;
          const pad = i === 0 ? 1 : 2;

          // Shadow / dark outline
          ctx.fillStyle = C_SNAKE_DARK;
          ctx.beginPath();
          ctx.roundRect(px + pad - 1, py + pad - 1, CELL - (pad * 2) + 2, CELL - (pad * 2) + 2, 4);
          ctx.fill();

          // Body fill
          const color = i === 0 ? C_SNAKE_HEAD : C_SNAKE_BODY;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.roundRect(px + pad, py + pad, CELL - pad * 2, CELL - pad * 2, 4);
          ctx.fill();

          // Head eyes
          if (i === 0) {
            ctx.fillStyle = '#1a1a2e';
            const ex = px + CELL / 2;
            const ey = py + CELL / 2;
            const eyeOffset = 4;
            const eyeR = 2;

            let e1, e2;
            if (dir.x === 1)       { e1 = {x: ex+3, y: ey-eyeOffset}; e2 = {x: ex+3, y: ey+eyeOffset}; }
            else if (dir.x === -1) { e1 = {x: ex-3, y: ey-eyeOffset}; e2 = {x: ex-3, y: ey+eyeOffset}; }
            else if (dir.y === -1) { e1 = {x: ex-eyeOffset, y: ey-3}; e2 = {x: ex+eyeOffset, y: ey-3}; }
            else                   { e1 = {x: ex-eyeOffset, y: ey+3}; e2 = {x: ex+eyeOffset, y: ey+3}; }

            ctx.beginPath(); ctx.arc(e1.x, e1.y, eyeR, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(e2.x, e2.y, eyeR, 0, Math.PI*2); ctx.fill();
          }
        });
      }

      function render() {
        ctx.fillStyle = C_BG;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        drawGrid();
        drawFood();
        drawSnake();
      }

      // ── Loop ─────────────────────────────────────────────────────────────
      function loop(ts) {
        if (gameOver) return;

        if (lastStep === null) lastStep = ts;
        if (ts - lastStep >= STEP_MS) {
          step();
          lastStep = ts;
        }

        render();
        if (!gameOver) {
          animId = requestAnimationFrame(loop);
        }
      }

      // Polyfill roundRect for older browsers
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
          if (w < 2 * r) r = w / 2;
          if (h < 2 * r) r = h / 2;
          this.beginPath();
          this.moveTo(x + r, y);
          this.arcTo(x + w, y,     x + w, y + h, r);
          this.arcTo(x + w, y + h, x,     y + h, r);
          this.arcTo(x,     y + h, x,     y,     r);
          this.arcTo(x,     y,     x + w, y,     r);
          this.closePath();
        };
      }

      // ── Boot ─────────────────────────────────────────────────────────────
      initState();
      animId = requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
